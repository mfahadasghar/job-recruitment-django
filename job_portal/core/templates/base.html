<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Job Portal{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .navbar, footer.bg-dark {
      background-color:rgb(19, 147, 151) !important;
    }
    .navbar .nav-link, footer a {
      color: #ffffff !important;
    }
    .navbar .nav-link:hover, footer a:hover {
      color:rgb(148, 189, 230) !important;
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100" style="background-color:rgb(243, 243, 243);">
  {% include 'core/header.html' %}

  <main class="flex-grow-1">
    <div class="container mt-4">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
      {% block landing_content %}{% endblock %}
      {% block content %}{% endblock %}
    </div>
  </main>
  {% include 'core/footer.html' %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
