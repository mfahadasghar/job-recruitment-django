{% extends 'base.html' %}
{% block content %}
<div class="container mt-4 mb-4">
  <h3 class="mb-4 text-center">Payment History</h3>
<ul class="list-group mt-3">
  {% for payment in payments %}
    <li class="list-group-item">
      {{ payment.timestamp|date:"M d, Y H:i" }} — <strong>{{ payment.plan.name }}</strong> — ${{ payment.amount }}
    </li>
  {% empty %}
    <li class="list-group-item">No payments made yet.</li>
  {% endfor %}
</ul>
</div>
{% endblock %}
